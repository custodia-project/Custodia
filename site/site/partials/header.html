      <header class="site-head">
        <span class="scroll-progress" aria-hidden="true"></span>
        <a href="{{homeHref}}" class="wordmark" aria-label="{{homeLabel}}">
          <svg class="mark is-intro" width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
            <defs><clipPath id="mark-clip"><rect x="2.5" y="2.5" width="18" height="18" rx="5" /></clipPath></defs>
            <rect class="mk-x" x="11.5" y="11.5" width="18" height="18" rx="5" fill="currentColor" clip-path="url(#mark-clip)" />
            <rect class="mk-a" x="2.5" y="2.5" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2.6" />
            <rect class="mk-b" x="11.5" y="11.5" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2.6" />
          </svg>
          <span>custodia</span>
        </a>
        <nav class="site-nav" aria-label="{{navLabel}}">
          <a href="{{inventoryHref}}" class="hide-sm">{{navInventory}}</a>
          <a href="{{connectorsHref}}" class="hide-sm">{{navConnectors}}</a>
          <a href="{{installHref}}" class="hide-sm">{{navInstall}}</a>
          <a href="{{limitsHref}}" class="hide-sm">{{navLimits}}</a>
          <a href="https://github.com/custodia-project/Custodia" class="hide-sm">GitHub</a>
          <a href="{{otherHref}}" class="lang" hreflang="{{otherLang}}" lang="{{otherLang}}" aria-label="{{otherLabel}}">{{otherCode}}</a>
          <a href="{{demo}}/{{demoLang}}" class="button is-primary">{{cta}}</a>
        </nav>
      </header>
